name: Keep Backend Alive

on:
  schedule:
    # Ping every 10 minutes
    - cron: '*/10 * * * *'
  workflow_dispatch: # Allow manual trigger

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Backend
        run: |
          echo "Pinging backend at $(date)"
          curl -f https://rubix-cube-solver-ac2d.onrender.com/ || echo "Ping failed"
